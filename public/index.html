<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filmore</title>
<style>
  :root { --bg:#fff8f0; --fg:#2b1d12; --dim:#7a6655; --accent:#ff7a1a; --card:#ffffff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:20px/1.45 Georgia,"Times New Roman",serif; min-height:100vh; }
  #bg { position:fixed; inset:0; background:url(/bg.jpg) center/cover no-repeat; opacity:1; transition:opacity 1.6s ease; }
  #bg.on { opacity:1; }
  #shade { position:fixed; inset:0; pointer-events:none; background:linear-gradient(180deg,rgba(40,18,0,.45),rgba(60,26,0,.55) 55%,var(--bg) 100%); }
  #credit { position:fixed; left:16px; bottom:12px; font-size:.75rem; color:#fff; text-shadow:0 1px 4px #000; font-style:italic; z-index:2; }
  main { position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:0 16px; }
  .searched main { padding-bottom:80px; }
  .hero { min-height:100vh; min-height:100svh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; transition:min-height .6s ease; }
  .searched .hero { min-height:46vh; }
  h1 { color:#fff; text-shadow:0 4px 30px rgba(0,0,0,.35); font-weight:400; letter-spacing:-.04em; line-height:.9; font-size:clamp(4rem,24vw,17rem); }
  h1 span { color:var(--accent); font-style:italic; text-shadow:0 4px 30px rgba(0,0,0,.25); }
  .tag { color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.4); margin:1rem 0 2rem; font-style:italic; font-size:clamp(1.3rem,3vw,2rem); }
  form { width:min(900px,100%); display:flex; gap:12px; }
  input { flex:1; min-width:0; background:#fff; color:var(--fg); border:0; box-shadow:0 6px 24px rgba(0,0,0,.25); border-radius:999px; padding:1.4rem 2rem; font:inherit; font-size:1.5rem; font-style:italic; }
  input:focus { outline:3px solid var(--accent); }
  input::placeholder { color:#a8937f; }
  button { background:var(--accent); color:#ffffff; box-shadow:0 6px 24px rgba(255,122,26,.45); border:0; border-radius:999px; padding:0 3rem; font:inherit; font-size:1.6rem; font-weight:700; font-style:italic; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .note { color:#fff; text-shadow:0 1px 8px rgba(0,0,0,.5); font-size:1.05rem; margin:1rem 0; min-height:1.4em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:28px; }
  .film { box-shadow:0 8px 28px rgba(80,40,0,.12); background:var(--card); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; animation:rise .5s both; }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } }
  .poster { aspect-ratio:2/3; width:100%; object-fit:cover; display:block; background:#ffe3c9; }
  .ph { aspect-ratio:2/3; display:flex; align-items:center; justify-content:center; padding:16px; text-align:center; font-size:1.3rem;
    background:linear-gradient(160deg,#ffe3c9,#ffc08a); color:#8a3d00; }
  .meta { padding:18px 20px 24px; }
  .meta h2 { font-size:1.6rem; font-style:italic; font-weight:700; line-height:1.25; }
  .dir { color:var(--accent); font-style:italic; font-size:1.3rem; margin:4px 0 8px; }
  .why { color:var(--dim); font-size:1.05rem; }
  .meta a { color:inherit; text-decoration:none; }
  .meta a:hover h2 { text-decoration:underline; }
  @media (max-width:560px) {
    form { flex-direction:column; }
    button { padding:1.3rem; font-size:1.5rem; }
    .grid { grid-template-columns:1fr; gap:24px; }
  }
  .err { color:#c0392b; }
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div><div id="credit">Photo: Moorish Cinema, CC0</div>
<main id="app">
  <section class="hero">
    <h1>Fil<span>more</span>.</h1>
    <p class="tag">More is more.</p>
    <form id="form">
      <input id="q" autocomplete="off" autofocus placeholder="What do you feel like?">
      <button id="go">Find</button>
    </form>
    <p class="note" id="note"></p>
  </section>
  <section class="grid" id="grid"></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function setScene(image, label) {
  if (!image) return;
  const img = new Image();
  img.onload = () => {
    $("bg").style.backgroundImage = `url("${image}")`;
    $("bg").classList.add("on");
    $("credit").textContent = label || "";
  };
  img.src = image;
}
fetch("/api/scene").then((r) => r.json()).then((s) => setScene(s.image, s.title && `${s.title} (${s.year})`)).catch(() => {});

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const query = $("q").value.trim();
  if (!query) return;
  $("go").disabled = true;
  $("note").className = "note";
  $("note").textContent = "Searching...";
  $("grid").innerHTML = "";
  document.body.classList.add("searched");
  try {
    const res = await fetch("/api/recommend", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ query }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    $("note").textContent = data.demo ? "Demo mode: add your API keys to get real picks for your input." :
      data.unverified ? "Picks are not verified yet: add a TMDB token for posters and director checks." : "";
    if (!data.films.length) $("note").textContent = "Nothing verified for that. Try describing it differently.";
    $("grid").innerHTML = data.films.map((f, i) => {
      const art = f.poster ? `<img class="poster" src="${esc(f.poster)}" alt="" loading="lazy">` : `<div class="ph">${esc(f.title)}</div>`;
      const title = `<h2>${esc(f.title)} <small>(${esc(f.year)})</small></h2>`;
      return `<article class="film" style="animation-delay:${i * 70}ms">${art}<div class="meta">
        ${f.tmdb ? `<a href="${esc(f.tmdb)}" target="_blank" rel="noopener">${title}</a>` : title}
        <p class="dir">${esc(f.director)}</p><p class="why">${esc(f.why)}</p></div></article>`;
    }).join("");
    const lead = data.films.find((f) => f.backdrop);
    if (lead) setScene(lead.backdrop, `${lead.title} (${lead.year})`);
    $("grid").scrollIntoView({ behavior:"smooth", block:"start" });
  } catch (err) {
    $("note").className = "note err";
    $("note").textContent = err.message || "Something went wrong. Try again.";
  } finally { $("go").disabled = false; }
});
</script>
</body>
</html>
