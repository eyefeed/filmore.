<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filmore</title>
<style>
  @font-face { font-family:"Mr Dafoe"; src:url(/fonts/MrDafoe.ttf) format("truetype"); font-display:swap; }
  :root { --fg:#fff; --dim:rgba(255,255,255,.7); }
  * { box-sizing:border-box; margin:0; }
  body { background:#000; color:var(--fg); font:18px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif; min-height:100vh; }
  #bg { position:fixed; inset:-40px; background:url(/bg.jpg) center/cover no-repeat; filter:blur(28px); }
  #phone { position:fixed; top:0; bottom:0; left:50%; width:min(100vw,480px); transform:translateX(-50%); background:url(/bg.jpg) center/cover no-repeat; opacity:0; transition:opacity 1.6s ease; }
  #phone.on { opacity:1; }
  #shade { position:fixed; inset:0; background:rgba(0,0,0,.7); pointer-events:none; }
  main { position:relative; z-index:1; max-width:480px; margin:0 auto; padding:0 24px; }
  .searched main { padding-bottom:80px; }
  .hero { min-height:100vh; min-height:100svh; display:flex; flex-direction:column; justify-content:center; padding:40px 0; transition:min-height .6s ease; }
  .searched .hero { min-height:50vh; }
  h1 { font:400 clamp(5rem,30vw,9rem)/1.05 "Mr Dafoe","Brush Script MT",cursive; letter-spacing:0; margin-bottom:28px; }
  form { display:flex; flex-direction:column; gap:12px; }
  input { width:100%; background:rgba(255,255,255,.12); color:var(--fg); border:1px solid rgba(255,255,255,.5); border-radius:14px; padding:1.1rem 1.2rem; font:inherit; font-size:1.2rem; }
  input::placeholder { color:var(--dim); }
  input:focus { outline:0; border-color:#fff; background:rgba(255,255,255,.2); }
  button { background:#fff; color:#000; border:0; border-radius:14px; padding:1.1rem; font:inherit; font-size:1.2rem; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .note { color:var(--dim); font-size:.95rem; margin:16px 0; min-height:1.4em; }
  .grid { display:grid; gap:22px; }
  .film { border-radius:14px; overflow:hidden; background:rgba(255,255,255,.1); animation:rise .5s both; }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } }
  .poster { aspect-ratio:2/3; width:100%; object-fit:cover; display:block; background:#222; }
  .ph { aspect-ratio:2/3; display:flex; align-items:center; justify-content:center; padding:16px; text-align:center; font-size:1.6rem; font-weight:700; background:rgba(255,255,255,.08); }
  .meta { padding:16px 18px 22px; }
  .meta h2 { font-size:1.5rem; line-height:1.1; font-weight:700; }
  .meta a { color:inherit; text-decoration:none; }
  .meta small { font-size:.9rem; color:var(--dim); font-weight:400; }
  .dir { margin:8px 0; font:italic 1.2rem Georgia,serif; }
  .why { color:var(--dim); font-size:.95rem; }
</style>
</head>
<body>
<div id="bg"></div><div id="phone"></div><div id="shade"></div>
<main id="app">
  <section class="hero">
    <h1>Filmore.</h1>
    <form id="form">
      <input id="q" autocomplete="off" autofocus placeholder="What do you feel like?">
      <button id="go">Find</button>
    </form>
    <p class="note" id="note"></p>
  </section>
  <section class="grid" id="grid"></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

// Background is a film poster under a 70% black overlay; falls back to the bundled photo.
function setScene(src) {
  const img = new Image();
  img.onload = () => {
    $("bg").style.backgroundImage = $("phone").style.backgroundImage = `url("${src}")`;
    $("phone").classList.add("on");
  };
  img.src = src;
}
setScene("/bg.jpg");
fetch("/api/scene").then((r) => r.json()).then((s) => s.image && setScene(s.image)).catch(() => {});

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const query = $("q").value.trim();
  if (!query) return;
  $("go").disabled = true;
  $("note").textContent = "Searching...";
  $("grid").innerHTML = "";
  document.body.classList.add("searched");
  try {
    const res = await fetch("/api/recommend", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ query }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    $("note").textContent = data.demo ? "Demo mode: add your API keys to get real picks for your input." :
      data.unverified ? "Picks are not verified yet: add a TMDB token for posters and director checks." : "";
    if (!data.films.length) $("note").textContent = "Nothing verified for that. Try describing it differently.";
    $("grid").innerHTML = data.films.map((f, i) => {
      const art = f.poster ? `<img class="poster" src="${esc(f.poster)}" alt="" loading="lazy">` : `<div class="ph">${esc(f.title)}</div>`;
      const title = `<h2>${esc(f.title)} <small>(${esc(f.year)})</small></h2>`;
      return `<article class="film" style="animation-delay:${i * 70}ms">${art}<div class="meta">
        ${f.tmdb ? `<a href="${esc(f.tmdb)}" target="_blank" rel="noopener">${title}</a>` : title}
        <p class="dir">${esc(f.director)}</p><p class="why">${esc(f.why)}</p></div></article>`;
    }).join("");
    const lead = data.films.find((f) => f.poster);
    if (lead) setScene(lead.poster);
    $("grid").scrollIntoView({ behavior:"smooth", block:"start" });
  } catch (err) {
    $("note").textContent = err.message || "Something went wrong. Try again.";
  } finally { $("go").disabled = false; }
});
</script>
</body>
</html>
